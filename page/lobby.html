<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Lobby</title>
  <link rel="preload" as="image" href="../background.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style/lobby.css?v=20260917olui1" />

  <script type="module" src="../js/lobby.js?v=20260917olui1" defer></script>
</head>
<body>
  <main class="container auth-shell lobby-shell">
    <header class="lobby-header">
      <div class="lobby-brand">
        <div class="lobby-brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="lobby-kicker">Campaign Hub</div>
          <h1>Game Lobby</h1>
          <p class="lobby-intro">Create a room, join your group, or return to an existing campaign.</p>
        </div>
      </div>
      <button id="logout-button" type="button">Log out</button>
    </header>

    <div id="user-card" class="panel lobby-user-panel"></div>

    <div class="lobby-action-grid">
      <section class="panel lobby-action-card create-game-panel">
        <div class="panel-heading-row">
          <div>
            <div class="panel-kicker">Host</div>
            <h2>Create a game</h2>
          </div>
          <span class="panel-symbol" aria-hidden="true">＋</span>
        </div>

        <label for="game-title">Game name</label>
        <input type="text" id="game-title" placeholder="Tuesday campaign" />

        <label for="game-mode">System</label>
        <select id="game-mode">
          <option value="openlegend">Open Legend</option>
          <option value="dnd">D&amp;D</option>
        </select>

        <button id="create-game-button" class="primary-action" type="button">Create game</button>
      </section>

      <section class="panel lobby-action-card join-game-panel">
        <div class="panel-heading-row">
          <div>
            <div class="panel-kicker">Join</div>
            <h2>Enter a game</h2>
          </div>
          <span class="panel-symbol" aria-hidden="true">↳</span>
        </div>

        <p class="muted action-description">Enter the four-letter code shared by your GM.</p>
        <label for="join-code">Game code</label>
        <input type="text" id="join-code" maxlength="4" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="ABCD" />
        <button id="join-game-button" class="primary-action" type="button">Join game</button>
      </section>
    </div>

    <section class="panel games-panel">
      <div class="games-panel-heading">
        <div>
          <div class="panel-kicker">Campaigns</div>
          <h2>Your games</h2>
        </div>
        <div class="muted games-helper">Tap a campaign to continue.</div>
      </div>
      <div id="games-list" class="list-stack"></div>
    </section>

    <p id="lobby-status" class="muted" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
